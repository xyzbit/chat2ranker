worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        client_max_body_size 20m;
        location = /health { auth_request off; return 200 '{"ok":true}'; }
        location ^~ /api/internal/ { return 404; }
        location = /control/v1/reload { return 404; }
        location /api/ {
            proxy_pass http://rank-api:8787;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Host $http_host;
            proxy_set_header X-Rank-Control-Token "";
            proxy_buffering off;
            proxy_read_timeout 900s;
        }
        location /control/ {
            proxy_pass http://rank-control:8788;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Host $http_host;
            proxy_set_header X-Rank-Control-Token "";
            proxy_buffering off;
            proxy_read_timeout 900s;
        }
        location /v1/ {
            auth_request off;
            proxy_pass http://rank-api:8787;
            proxy_set_header X-Rank-Control-Token "";
            proxy_buffering off;
            proxy_read_timeout 900s;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
    # Runtime callbacks share no management or public-serving routes.
    server {
        listen 8081;
        client_max_body_size 4k;
        location = /v1/model-permits {
            proxy_pass http://execution-api:8790;
            proxy_set_header Authorization $http_authorization;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }
        location / { return 404; }
    }

}
