apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: object-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: objects
spec:
  selector:
    app: objects
  ports:
    - port: 8333
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: objects
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: objects
  template:
    metadata:
      labels:
        app: objects
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: objects
          image: rank-object-lab:build
          imagePullPolicy: Never
          args: [mini, '-dir=/data', '-ip=127.0.0.1', '-ip.bind=0.0.0.0', '-admin.ui=false', '-webdav=false', '-s3.port.iceberg=0', '-s3.port.lance=0', '-master.telemetry=false', '-volume.max=2']
          env:
            - name: S3_BUCKET
              value: rank-artifacts
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: {name: execution-lab, key: EXECUTION_S3_ACCESS_KEY}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: execution-lab, key: EXECUTION_S3_SECRET_KEY}
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: '1', memory: 512Mi}
          readinessProbe:
            tcpSocket: {port: 8333}
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: object-data}
