apiVersion: v1
kind: ConfigMap
metadata:
  name: execution-config
data:
  EXECUTION_S3_ENDPOINT: objects:8333
  EXECUTION_S3_BUCKET: rank-artifacts
---
apiVersion: v1
kind: Service
metadata:
  name: execution-api
spec:
  selector: {app: execution-api}
  ports:
    - port: 8790
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-api
spec:
  replicas: 1
  selector:
    matchLabels: {app: execution-api}
  template:
    metadata:
      labels: {app: execution-api}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000}
      terminationGracePeriodSeconds: 25
      containers:
        - name: api
          image: rank-execution-lab:build
          imagePullPolicy: Never
          args: ['-role=api', '-addr=0.0.0.0:8790', '-artifacts=/state/artifacts', '-sandboxes=/state/sandboxes', '-s3-tls=false', '-database-timeout=3s', '-worker-timeout=15s', '-cleanup-grace=2s', '-persistence-timeout=3s', '-rescue-after=25s', '-shutdown-grace=15s', '-online-slots=1', '-evaluation-slots=1', '-max-model-concurrent=4', '-max-tenant-concurrent=4', '-max-queued=50']
          env:
            - name: EXECUTION_CAPACITY_TOKEN
              valueFrom:
                secretKeyRef: {name: execution-capacity, key: token, optional: true}
          envFrom:
            - secretRef: {name: execution-runtime}
            - configMapRef: {name: execution-config}
          resources:
            requests: {cpu: 100m, memory: 96Mi}
            limits: {cpu: '1', memory: 256Mi}
          readinessProbe:
            httpGet: {path: /v1/health, port: 8790}
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: state, mountPath: /state}
            - {name: temporary, mountPath: /tmp}
      volumes:
        - name: state
          emptyDir: {sizeLimit: 128Mi}
        - name: temporary
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: execution-worker}
  template:
    metadata:
      labels: {app: execution-worker}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000}
      terminationGracePeriodSeconds: 25
      containers:
        - name: worker
          image: rank-execution-lab:build
          imagePullPolicy: Never
          args: ['-role=worker', '-artifacts=/state/artifacts', '-sandboxes=/state/sandboxes', '-s3-tls=false', '-database-timeout=3s', '-worker-timeout=15s', '-cleanup-grace=2s', '-persistence-timeout=3s', '-rescue-after=25s', '-shutdown-grace=15s', '-online-slots=1', '-evaluation-slots=1', '-max-model-concurrent=4', '-max-tenant-concurrent=4', '-max-queued=50']
          envFrom:
            - secretRef: {name: execution-runtime}
            - configMapRef: {name: execution-config}
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: '1', memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: state, mountPath: /state}
            - {name: temporary, mountPath: /tmp}
      volumes:
        - name: state
          emptyDir: {sizeLimit: 256Mi}
        - name: temporary
          emptyDir: {sizeLimit: 64Mi}
