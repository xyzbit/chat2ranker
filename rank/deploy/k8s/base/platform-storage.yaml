apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rank-control-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rank-private-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 128Mi}
